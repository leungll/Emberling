[project]
name = "emberling-media"
version = "0.1.0"
description = "Media service: source upload, transcription, timeline checks, rendering and clip checks."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
