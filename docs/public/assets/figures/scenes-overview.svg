.arrow{stroke:#6e7681}
.name,.focus{fill:#e6edf3}
.label{fill:#7d8590}
.item{fill:#aab3bd}
.gold{fill:#d9a94f}.violet{fill:#a78bfa}.rose{fill:#f0708f}
}
</style>
