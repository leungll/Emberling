<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-labelledby="title"><title id="title">Focus and capabilities of three scenarios: AI image generation service, short-video editing Agent, vulnerability repair and release</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.card{fill:#fff;stroke:#e4e7ec}
.rule{stroke:#eceff3}
.arrow{stroke:#a3adba;fill:none}
.name{fill:#1f2937;font-size:15px;font-weight:650}
.label{fill:#8590a0;font-size:11.5px;font-weight:500}
.focus{fill:#1f2937;font-size:13px;font-weight:600}
.item{fill:#55606f;font-size:12.5px;font-weight:450}
.gold{fill:#b7791f}.violet{fill:#7c3aed}.rose{fill:#be3455}
@media (prefers-color-scheme:dark){
.card{fill:#161b22;stroke:#30363d}
