<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" role="img" aria-labelledby="title desc">
<title id="title">In-flight slots and queueing</title>
<desc id="desc">Six requests are submitted at once to an image Provider with two in-flight slots. Two start immediately and four queue; each time a callback completes and frees a slot, the head of the queue starts. The usage line never exceeds two.</desc>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#dfe5ec"/></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b"/></marker>
</defs>
<style>text{font-family:"SFMono-Regular",Consolas,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.h{font-size:15px;font-weight:600}.t{font-size:13px}.s{font-size:11.5px;fill:#64748b}.tag{font-size:11px;font-weight:600}</style>
<rect width="1120" height="510" rx="10" fill="#f4f5f7"/>
<rect width="1120" height="510" rx="10" fill="url(#dots)"/>
<text x="40" y="44" class="h">Full slots mean a queue: 6 requests at once, 2 in-flight slots on the image Provider</text>
<text x="40" y="66" class="s">Each task calls back 15 s after acceptance; time 0 is submission; data from each Run's Events</text>
<rect x="857.2" y="30" width="222.8" height="24" rx="12" fill="#e3f6ef" stroke="#059669"/><text x="968.6" y="46" text-anchor="middle" class="tag" style="fill:#059669">Real demo run · Mock Provider</text>
<rect x="32" y="88" width="1056" height="260" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
<text x="52" y="126" class="t">Request 1</text>
<rect x="171.068" y="112" width="267.178" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="446.24600000000004" y="126" class="s">15.1 s done</text>
<text x="52" y="166" class="t">Request 2</text>
<rect x="170.89" y="152" width="267.35600000000005" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="446.24600000000004" y="166" class="s">15.1 s done</text>
<text x="52" y="206" class="t">Request 3</text>
<rect x="170.89" y="192" width="267.71200000000005" height="20" rx="4" fill="#fff4dc" stroke="#d97706" stroke-dasharray="4 3"/>
<rect x="438.60200000000003" y="192" width="267.17800000000005" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="713.7800000000001" y="206" class="s">30.1 s done</text>
<text x="52" y="246" class="t">Request 4</text>
<rect x="171.068" y="232" width="344.43000000000006" height="20" rx="4" fill="#fff4dc" stroke="#d97706" stroke-dasharray="4 3"/>
<rect x="515.498" y="232" width="267.178" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="790.676" y="246" class="s">34.4 s done</text>
<text x="52" y="286" class="t">Request 5</text>
<rect x="171.958" y="272" width="534.0" height="20" rx="4" fill="#fff4dc" stroke="#d97706" stroke-dasharray="4 3"/>
<rect x="705.958" y="272" width="267.3560000000001" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="981.3140000000001" y="286" class="s">45.1 s done</text>
<text x="52" y="326" class="t">Request 6</text>
<rect x="171.958" y="312" width="610.8960000000001" height="20" rx="4" fill="#fff4dc" stroke="#d97706" stroke-dasharray="4 3"/>
<rect x="782.854" y="312" width="267.5339999999999" height="20" rx="4" fill="#eae3f8" stroke="#7c3aed"/>
<text x="1042.388" y="326" text-anchor="end" class="s" style="fill:#7c3aed">49.5 s done</text>
<text x="52" y="414" class="t">Slots in use</text>
<line x1="170" y1="394" x2="1060" y2="394" stroke="#dc2626" stroke-dasharray="4 4"/><text x="1060" y="388" text-anchor="end" class="s" style="fill:#dc2626">limit 2</text>
<polyline points="170.0,430 170.89,430 170.89,412 171.068,412 171.068,394 438.24600000000004,394 438.24600000000004,412 438.24600000000004,412 438.24600000000004,430 438.60200000000003,430 438.60200000000003,412 515.498,412 515.498,394 705.7800000000001,394 705.7800000000001,412 705.958,412 705.958,394 782.676,394 782.676,412 782.854,412 782.854,394 973.3140000000001,394 973.3140000000001,412 1050.388,412 1050.388,430 1060.0,430" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="160" y="434" text-anchor="end" class="s">0</text><text x="160" y="416" text-anchor="end" class="s">1</text><text x="160" y="398" text-anchor="end" class="s">2</text>
<line x1="170" y1="442" x2="1060" y2="442" stroke="#cbd5e1"/><line x1="170.0" y1="442" x2="170.0" y2="447" stroke="#cbd5e1"/><text x="170.0" y="462" text-anchor="middle" class="s">0 s</text><line x1="259.0" y1="442" x2="259.0" y2="447" stroke="#cbd5e1"/><text x="259.0" y="462" text-anchor="middle" class="s">5 s</text><line x1="348.0" y1="442" x2="348.0" y2="447" stroke="#cbd5e1"/><text x="348.0" y="462" text-anchor="middle" class="s">10 s</text><line x1="437.0" y1="442" x2="437.0" y2="447" stroke="#cbd5e1"/><text x="437.0" y="462" text-anchor="middle" class="s">15 s</text><line x1="526.0" y1="442" x2="526.0" y2="447" stroke="#cbd5e1"/><text x="526.0" y="462" text-anchor="middle" class="s">20 s</text><line x1="615.0" y1="442" x2="615.0" y2="447" stroke="#cbd5e1"/><text x="615.0" y="462" text-anchor="middle" class="s">25 s</text><line x1="704.0" y1="442" x2="704.0" y2="447" stroke="#cbd5e1"/><text x="704.0" y="462" text-anchor="middle" class="s">30 s</text><line x1="793.0" y1="442" x2="793.0" y2="447" stroke="#cbd5e1"/><text x="793.0" y="462" text-anchor="middle" class="s">35 s</text><line x1="882.0" y1="442" x2="882.0" y2="447" stroke="#cbd5e1"/><text x="882.0" y="462" text-anchor="middle" class="s">40 s</text><line x1="971.0" y1="442" x2="971.0" y2="447" stroke="#cbd5e1"/><text x="971.0" y="462" text-anchor="middle" class="s">45 s</text><line x1="1060.0" y1="442" x2="1060.0" y2="447" stroke="#cbd5e1"/><text x="1060.0" y="462" text-anchor="middle" class="s">50 s</text>
<rect x="52" y="476" width="26" height="14" rx="3" fill="#fff4dc" stroke="#d97706" stroke-dasharray="4 3"/><text x="86" y="488" class="s">Queued for a slot (READY, with queue position)</text>
<rect x="400" y="476" width="26" height="14" rx="3" fill="#eae3f8" stroke="#7c3aed"/><text x="434" y="488" class="s">Holding a slot: dispatched, awaiting callback</text>
<text x="736" y="488" class="s">At most 2 held; a freed slot starts the next in queue</text>
</svg>
