<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" role="img" aria-labelledby="title desc">
<title id="title">Deployment confirmation after a lost response</title>
<desc id="desc">Sequence across Agent, Emberling and a simulated release service. An approved release request carries an operation ID, but the response is lost. Deployment may already have happened. Emberling queries by operation ID instead of resending, checks the version and deployment results, and returns the outcome, evidence and remaining work. Proposed design for a workload in development.</desc>
<defs>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#dfe5ec" /></pattern>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#64748b" /></marker>
<marker id="green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#059669" /></marker>
</defs>
<style>
text{font-family:"SFMono-Regular",Consolas,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}
.heading{font-size:13px;font-weight:600}.label{font-size:16px;font-weight:600}.msg{font-size:12px;font-weight:600}.sub{font-size:11px;fill:#64748b}.tag{font-size:11px;font-weight:600;fill:#b45309}
.edge{fill:none;stroke:#64748b;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#arrow)}
.ok{stroke:#059669;marker-end:url(#green)}.dash{stroke-dasharray:5 4}
.life{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4 5}
</style>
<rect width="1120" height="540" rx="10" fill="#f4f5f7" />
<rect width="1120" height="540" rx="10" fill="url(#dots)" />

<text x="44" y="42" class="heading" font-size="12" style=";font-size:12px">04 / Deployment confirmation</text>
<rect x="796" y="26" width="280" height="24" rx="12" fill="#fff7e8" stroke="#d97706" stroke-width="1" />
<text x="936" y="42" class="tag" text-anchor="middle" font-size="10" style=";font-size:10px">IN DEVELOPMENT · PROPOSED · MOCK SERVICE</text>

<rect x="110" y="68" width="180" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
<text x="200" y="96" class="label" text-anchor="middle" font-size="14" style=";font-size:14px">Agent</text>
<rect x="470" y="68" width="180" height="44" rx="7" fill="#ffffff" stroke="#475569" stroke-width="1.4" />
<text x="560" y="96" class="label" text-anchor="middle" font-size="14" style=";font-size:14px">Emberling</text>
<rect x="830" y="68" width="180" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" />
<text x="920" y="96" class="label" text-anchor="middle" font-size="14" style=";font-size:14px">Mock release service</text>

<path d="M200 112 V516" class="life" />
<path d="M560 112 V516" class="life" />
<path d="M920 112 V516" class="life" />

<text x="44" y="154" class="sub" font-size="10" style=";font-size:10px">1</text>
<path d="M200 150 H556" class="edge" />
<text x="380" y="142" class="msg" text-anchor="middle">Start an approved release</text>

<text x="44" y="194" class="sub" font-size="10" style=";font-size:10px">2</text>
<path d="M560 190 H916" class="edge" />
<text x="740" y="182" class="msg" text-anchor="middle">Deploy request with operation ID</text>

<text x="44" y="240" class="sub" font-size="10" style=";font-size:10px">3</text>
<path d="M920 236 H744" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" />
<circle cx="732" cy="236" r="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.2" />
<path d="M727 231 737 241 M737 231 727 241" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" />
<text x="832" y="228" class="msg" text-anchor="middle" style="fill:#dc2626">Response lost</text>
<text x="832" y="256" class="sub" text-anchor="middle" font-size="10" style=";font-size:10px">Deployment may already be live</text>

<rect x="380" y="276" width="360" height="52" rx="7" fill="#fff4dc" stroke="#d97706" stroke-width="1.2" />
<text x="560" y="298" class="heading" text-anchor="middle" font-size="12" style=";font-size:12px">Unknown outcome: do not resend</text>
<text x="560" y="317" class="sub" text-anchor="middle" font-size="10" style=";font-size:10px">Query the authoritative result before any further release action</text>

<text x="44" y="358" class="sub" font-size="10" style=";font-size:10px">4</text>
<path d="M560 354 H916" class="edge" />
<text x="740" y="346" class="msg" text-anchor="middle">Query deployment by operation ID</text>

<text x="44" y="398" class="sub" font-size="10" style=";font-size:10px">5</text>
<path d="M920 394 H564" class="edge ok dash" />
<text x="740" y="386" class="msg" text-anchor="middle" style="fill:#047857">Actual version and deployment checks</text>

<rect x="380" y="414" width="360" height="52" rx="7" fill="#e3f6ef" stroke="#059669" stroke-width="1.2" />
<text x="560" y="436" class="heading" text-anchor="middle" font-size="12" style=";font-size:12px">Check the version and deployment results</text>
<text x="560" y="455" class="sub" text-anchor="middle" font-size="10" style=";font-size:10px">Then evaluate completion against the goal</text>

<text x="44" y="496" class="sub" font-size="10" style=";font-size:10px">6</text>
<path d="M560 492 H204" class="edge" />
<text x="380" y="484" class="msg" text-anchor="middle">Deliver outcome, evidence and remaining work</text>
</svg>
