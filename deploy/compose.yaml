# Local development topology: one Backend process, Studio, PostgreSQL 18 and a
# persistent volume. Redis, external queues and distributed workers are not part of the
# MVP and must not appear here.
#
# Known gap (AIGC image preview): the image URI a completed image_generation NodeRun
# returns is built from EMBERLING_MODEL_PROVIDER_BASE_URL (backend/internal/adapters/
# mocktask/adapter.go successPayload), the same value the backend container uses to reach
# the mockprovider container. That value must be the container-DNS name
# "http://mockprovider:9101" for the backend's own dispatch to work, but a browser loading
# Studio from the host cannot resolve that hostname, so the AIGC image preview will not
# load an <img> when the full stack runs under `docker compose up --profile mock` (the raw
# ImageRef reference is still shown correctly; only the rendered preview is affected). No
# existing config key lets these two audiences see a different base URL, and this change is
# restricted to compose/Makefile/CI/studio, so the fix (for example a
# backend-configured public base URL used only for the returned ImageRef.uri) is out of
# scope here and reported rather than worked around with an invented backend env var.
# The generate_image Tool's images are not affected: the Mock Provider builds their URL
# from EMBERLING_MOCKPROVIDER_PUBLIC_URL (see the mockprovider service), so the cover
# example a media_result NodeRun delivers opens in the browser.
name: emberling

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: emberling
      POSTGRES_DB: emberling
      # Local development only. This value never leaves the compose network, and the
      # deployed configuration supplies credentials through the environment instead.
      POSTGRES_HOST_AUTH_METHOD: trust
    # postgres:18 keeps data in a major-version subdirectory under /var/lib/postgresql and
    # refuses to start when a volume is mounted at the pre-18 path /var/lib/postgresql/data.
    volumes:
      - emberling-postgres-data:/var/lib/postgresql
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emberling -d emberling"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Deterministic Provider fixture used by integration, failure and the three MVP
  # acceptance E2E scenarios. `docker compose --profile mock up` starts it alongside
  # postgres, backend and studio for a full acceptance stack.
  #
  # The host-published port below makes http://localhost:9101 reachable from a browser on
  # the host. EMBERLING_MOCKPROVIDER_PUBLIC_URL makes generated image URLs (POST /v1/assets)
  # name that host address even though the backend calls the Provider as
  # "http://mockprovider:9101"; the image_generation node's URI is still built from
  # EMBERLING_MODEL_PROVIDER_BASE_URL -- see the gap noted at the top of this file.
  mockprovider:
    profiles: ["mock"]
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
      args:
        CMD: mockprovider
    ports:
      - "9101:9101"
    # This stack is a demo and test configuration, so the Mock Provider's control surface
    # is enabled here: POST /control/pause and /control/release (external barrier),
    # GET /control/barrier, GET /control/record (append-only dispatch record) and
    # POST /control/tasks/{externalTaskId}/callback (redeliver on command). Without
    # MOCKPROVIDER_TEST_CONTROLS these routes do not exist. The record lives on its own
    # volume so it survives a Mock Provider restart; it holds identifiers and short
    # summaries only, never a callback token or an authorization header.
    environment:
      MOCKPROVIDER_TEST_CONTROLS: "true"
      MOCKPROVIDER_RECORD_PATH: /var/lib/emberling/mockprovider/dispatch-record.jsonl
      # Must match the host side of the published port above for the browser to load it.
      EMBERLING_MOCKPROVIDER_PUBLIC_URL: ${EMBERLING_MOCKPROVIDER_PUBLIC_URL:-http://localhost:9101}
    volumes:
      - emberling-mockprovider-record:/var/lib/emberling/mockprovider

  # Deterministic production deployment stand-in the deploy Tool calls. Like mockprovider
  # it is a demo and test fixture: its control surface (POST /control/pause and
  # /control/release, GET /control/barrier, GET /control/record) is enabled here, and the
  # request record lives on its own volume so a script can count how many times production
  # was reached for one operationId. The record holds identifiers only, never parameters.
  mockproduction:
    profiles: ["mock"]
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
      args:
        CMD: mockproduction
    ports:
      - "9102:9102"
    environment:
      MOCKPRODUCTION_TEST_CONTROLS: "true"
      MOCKPRODUCTION_RECORD_PATH: /var/lib/emberling/mockproduction/request-record.jsonl
    volumes:
      - emberling-mockproduction-record:/var/lib/emberling/mockproduction

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
      args:
        CMD: emberling
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      EMBERLING_DATABASE_URL: postgres://emberling@postgres:5432/emberling?sslmode=disable
      EMBERLING_DATABASE_MAX_CONNS: "10"
      EMBERLING_ASSET_STORAGE_ROOT: /var/lib/emberling/assets
      # 16 MiB: one reference image per upload; generic file upload is out of MVP scope.
      EMBERLING_ASSET_MAX_UPLOAD_BYTES: "16777216"
      EMBERLING_MODEL_PROVIDER_BASE_URL: ${EMBERLING_MODEL_PROVIDER_BASE_URL:-http://mockprovider:9101}
      # Secrets are placeholders resolved from the developer's own environment. They are
      # never committed, and they never reach a Definition, an Event or Trace.
      EMBERLING_MODEL_PROVIDER_API_KEY: ${EMBERLING_MODEL_PROVIDER_API_KEY:?set EMBERLING_MODEL_PROVIDER_API_KEY in your shell or .env}
      # Reachable from the mockprovider container as the compose service name, not
      # "localhost": a callback is delivered container-to-container, never through the
      # host loopback.
      EMBERLING_CALLBACK_BASE_URL: ${EMBERLING_CALLBACK_BASE_URL:-http://backend:8080}
      EMBERLING_CALLBACK_SIGNING_SECRET: ${EMBERLING_CALLBACK_SIGNING_SECRET:?set EMBERLING_CALLBACK_SIGNING_SECRET in your shell or .env}
      # Registers the deploy Tool against the mockproduction service (container DNS, like
      # the Model Provider above). Without this key the Backend does not register the Tool.
      EMBERLING_PRODUCTION_BASE_URL: ${EMBERLING_PRODUCTION_BASE_URL:-http://mockproduction:9102}
      EMBERLING_RECONCILE_INTERVAL: 5s
      EMBERLING_RECONCILE_BATCH_SIZE: "100"
      EMBERLING_PENDING_CALLBACK_TTL: 24h
      EMBERLING_PENDING_CALLBACK_MAX_PAYLOAD_BYTES: "262144"
      EMBERLING_TRACE_MAX_FIELD_BYTES: "8192"
      EMBERLING_TRACE_MAX_RESPONSE_BYTES: "1048576"
      EMBERLING_HTTP_ADDR: ":8080"
    volumes:
      - emberling-asset-data:/var/lib/emberling/assets

  # Thin client (CLAUDE.md: Studio owns no Runtime behaviour). It serves the production
  # build and proxies /api to the backend service exactly as the dev server does
  # (studio/vite.config.ts's `preview` block), so no Studio-only routing logic exists.
  studio:
    build:
      context: ../studio
      dockerfile: ../deploy/Dockerfile.studio
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      EMBERLING_BACKEND_ORIGIN: http://backend:8080

volumes:
  emberling-postgres-data:
  emberling-asset-data:
  emberling-mockprovider-record:
  emberling-mockproduction-record:
