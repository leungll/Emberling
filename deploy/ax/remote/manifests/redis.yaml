# Modified copy of deploy/redis.yaml from github.com/google/ax at commit
# ac2332829f22360ff97b0ba34d94dd0dd782f17e. Changes: the data lives on a
# PersistentVolumeClaim and Redis writes an append-only file, so a Redis
# restart does not lose AX's Task and Workspace records while their Substrate
# actors keep running; the Deployment uses the Recreate strategy so two pods
# never share the volume.

apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ax-redis-data
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-redis
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ax-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: ax-redis
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-redis
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: ax-redis
